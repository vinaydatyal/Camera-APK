name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk VlogCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VlogCam-apk
          path: VlogCam.apk

      - name: Publish to "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          name: VlogCam – latest build
          prerelease: true
          files: VlogCam.apk
          body: |
            Latest VlogCam build from commit ${{ github.sha }}.
            Download **VlogCam.apk** on your phone and open it to install
            (allow "Install unknown apps" for your browser/file manager when asked).
